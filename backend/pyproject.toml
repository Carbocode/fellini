[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "fellini"
version = "0.1.0"
description = "Local-first non-destructive video editor with AI-assisted tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Codex" }]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-multipart>=0.0.27,<1.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.scripts]
fellini = "fellini.cli:main"

[tool.poetry]
packages = [{ include = "fellini", from = "src" }]

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28.0,<1.0.0"
pytest = ">=8.4.0,<9.0.0"
ruff = ">=0.12.0,<1.0.0"

[tool.poetry.group.asr]
optional = true

[tool.poetry.group.asr.dependencies]
faster-whisper = ">=1.1.0,<2.0.0"
torch = "2.10.0"
torchaudio = "2.10.0"
whisperx = ">=3.4.0,<4.0.0"

[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
accelerate = ">=1.10.0,<2.0.0"
transformers = ">=4.57.0,<5.0.0"

[tool.poetry.group.vision]
optional = true

[tool.poetry.group.vision.dependencies]
torch = "2.10.0"
torchvision = ">=0.25.0,<0.26.0"
av = ">=16.0.0,<17.0.0"
opencv-python = ">=4.8.0,<5.0.0"
imageio = ">=2.25.0,<3.0.0"
imageio-ffmpeg = ">=0.6.0,<1.0.0"
hydra-core = ">=1.3.2,<2.0.0"
tqdm = ">=4.66.1,<5.0.0"
requests = ">=2.32.0,<3.0.0"
huggingface-hub = "0.36.2"
safetensors = ">=0.6.0,<1.0.0"
einops = ">=0.6.0,<1.0.0"
transformers = ">=4.57.0,<5.0.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["B008", "S101", "S603", "S607"]
